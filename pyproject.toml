[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-innovation-analytics"
version = "0.1.0"
description = "Reusable quality checks for a multi-source European innovation analytics project"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
